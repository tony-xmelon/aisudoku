name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Corpus photographs are not in the repository, so every test that needs one
      # skips here. That is expected: see docs/superpowers/plans.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Assemble release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: aisudoku-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  distribute:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The app id is committed, so the only thing CI is missing is a credential.
      # Either kind works; FIREBASE_TOKEN is far easier to obtain.
      - name: Check a Firebase credential is configured
        id: firebase
        env:
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "kind=token" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "kind=key" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No Firebase credential, so this build was not distributed."
            echo "::warning::Set FIREBASE_TOKEN (run: firebase login:ci) or FIREBASE_SERVICE_ACCOUNT."
            echo "::warning::See docs/firebase-distribution.md."
          fi

      # A refresh token from `firebase login:ci`. Needs no Google Cloud console access.
      - name: Distribute using a Firebase token
        if: steps.firebase.outputs.kind == 'token'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./gradlew :app:assembleRelease appDistributionUploadRelease --console=plain

      - name: Distribute using a service account
        if: steps.firebase.outputs.kind == 'key'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"
          export FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase-key.json"
          ./gradlew :app:assembleRelease appDistributionUploadRelease --console=plain
          rm -f "$RUNNER_TEMP/firebase-key.json"
